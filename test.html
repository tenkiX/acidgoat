<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Könyv - Vásárlás Gombbal</title>

  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; background-color: #f4f4f9; }

    #ar-view-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .ar-btn {
      position: relative;
      display: inline-block;
      padding: 24px 48px;
      font-size: 26px;
      font-weight: bold;
      background-color: #008CBA;
      color: white;
      text-decoration: none;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      text-transform: uppercase;
      text-align: center;
      overflow: hidden;
    }
    
    .ar-btn:active { transform: scale(0.95); }

    .apple-ar-img {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0; 
      z-index: 1;
    }

    .btn-text {
      position: relative;
      z-index: 2;
    }
  </style>
</head>
<body>

  <div id="ar-view-container">
    
    <!-- 
      A LINKBEN VAN A MÁGIA! 
      A fájl neve után a # jellel kezdve paramétereket adunk át az Apple kamerájának.
      (A szóközöket %20-szal kell írni a linkek szabályai miatt)
    -->
    <a id="ar-link" 
       href="https://developer.apple.com/quick-look-gallery/models/cosmonaut/CosmonautSuit_en.reality#checkoutTitle=Kiterjesztett%20Valóság%20Könyv&checkoutSubtitle=Multilearn%20Kft.&price=4990%20Ft&callToAction=Vásárlás" 
       rel="ar" 
       class="ar-btn">
      <img src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" class="apple-ar-img" alt="AR Indító" />
      <span class="btn-text">Kipróbálás (AR)</span>
    </a>

  </div>

  <script>
    // EZ A KIS KÓD KAPJA EL A GOMBNYOMÁST AZ AR-BŐL
    const arLink = document.getElementById('ar-link');

    arLink.addEventListener('message', function (event) {
      // Ha a visszajövő üzenet az, hogy a gombot megnyomták:
      if (event.data === '_apple_ar_quicklook_button_tapped') {
        
        // Itt át is irányítjuk a saját webshopod pénztárához! 
        window.location.href = "https://shop.arbookslibrary.com/az_emberi_test_kiterjesztett_valosag_konyv";
        
      }
    });
  </script>

</body>
</html>
