<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Könyv Teszt - Stabil</title>

  <style>
    /* A 3D nézőke beállítása: mobilon és asztalin is látszik */
    #ar-viewer {
      width: 100%;
      height: 100vh; /* Mobilon kitölti a teljes képernyőt */
      background-color: #f4f4f9;
    }

    @media (min-width: 768px) {
      #ar-viewer {
        height: 600px; /* Asztali gépen kisebb dobozban jelenik meg */
      }
    }

    /* A saját, lebegő AR gombunk dizájnja */
    .my-custom-ar-button {
      position: absolute; /* A 3D modell "fölé" lebegtetjük */
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%); /* Középre zárás */
      
      padding: 18px 36px;
      font-size: 22px;
      font-weight: bold;
      background-color: #008CBA;
      color: white;
      border: none;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      cursor: pointer;
    }

    /* Kattintási effekt */
    .my-custom-ar-button:active {
      background-color: #007399;
      transform: translateX(-50%) scale(0.95);
    }
  </style>
</head>
<body>

  <!-- Google Model-Viewer motor betöltése -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>

  <!-- A 3D AR Megjelenítő -->
  <model-viewer 
    id="ar-viewer"
    src="https://modelviewer.dev/shared-assets/models/RobotExpressive.glb" 
    ios-src="https://modelviewer.dev/shared-assets/models/Astronaut.usdz"
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    ar-placement="floor"
    disable-tap
    camera-controls 
    autoplay 
    animation-name="Dance"
    shadow-intensity="1">
    
    <!-- A gomb, ami csak AR-képes telefonokon jelenik meg -->
    <button slot="ar-button" class="my-custom-ar-button">
      Kipróbálás (AR)
    </button>
  </model-viewer>

</body>
</html>
