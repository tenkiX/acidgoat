<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Könyv - Stabil iOS</title>

  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; background-color: #f4f4f9; }

    /* =========================================
       ALAPÉRTELMEZETT (MOBIL) NÉZET: Csak a gomb
       ========================================= */
    #mobile-ar-view {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .ar-btn {
      display: inline-block;
      padding: 24px 48px;
      font-size: 26px;
      font-weight: bold;
      background-color: #008CBA;
      color: white;
      text-decoration: none;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      text-transform: uppercase;
      text-align: center;
    }
    
    .ar-btn:active { transform: scale(0.95); }

    /* Az asztali nézet doboza üresen indul */
    #desktop-3d-view {
      width: 100%;
      height: 600px;
      display: none;
    }

    @media (min-width: 768px) {
      #mobile-ar-view { display: none; }
      #desktop-3d-view { display: block; }
    }
  </style>
</head>
<body>

  <!-- MOBIL KONTÉNER -->
  <div id="mobile-ar-view">
    <a id="ar-link" href="#" class="ar-btn">Kipróbálás (AR)</a>
  </div>

  <!-- ASZTALI KONTÉNER (Üres, amíg a JS fel nem tölti) -->
  <div id="desktop-3d-view"></div>

  <script>
    const userAgent = navigator.userAgent || navigator.vendor || window.opera;
    const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(userAgent);
    
    const arLink = document.getElementById('ar-link');

    // 1. HA ASZTALI GÉP (Betöltjük a 3D nézőkét)
    if (!isMobile) {
      const desktopView = document.getElementById('desktop-3d-view');
      desktopView.innerHTML = `
        <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"><\/script>
        <model-viewer 
          src="https://modelviewer.dev/shared-assets/models/RobotExpressive.glb" 
          camera-controls autoplay shadow-intensity="1"
          style="width: 100%; height: 100%;">
        </model-viewer>
      `;
    } 
    
    // 2. HA MOBIL (Gomb beállítása)
    else {
      // Itt használd az Apple linkjét a biztonság kedvéért a teszthez
      const realityUrl = "https://developer.apple.com/augmented-reality/quick-look/models/cosmonaut/CosmonautSuit_en.reality";
      const glbUrl = "https://modelviewer.dev/shared-assets/models/RobotExpressive.glb";

      // iOS
      if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
        arLink.href = realityUrl;
        arLink.setAttribute("rel", "ar");
        arLink.innerHTML = "<img src='data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=' style='display:none;' />Kipróbálás (AR)";
      } 
      // Android
      else {
        const intentUrl = `intent://arvr.google.com/scene-viewer/1.0?file=${glbUrl}&mode=ar_only#Intent;scheme=https;package=com.google.ar.core;action=android.intent.action.VIEW;end;`;
        arLink.href = intentUrl;
      }
    }
  </script>

</body>
</html>
