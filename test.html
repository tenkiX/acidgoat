<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Könyv - Csak Apple AR</title>

  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; background-color: #f4f4f9; }

    /* A gombot minden eszközön középre zárjuk */
    #ar-view-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    /* A Gomb stílusa */
    .ar-btn {
      position: relative;
      display: inline-block;
      padding: 24px 48px;
      font-size: 26px;
      font-weight: bold;
      background-color: #008CBA;
      color: white;
      text-decoration: none;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      text-transform: uppercase;
      text-align: center;
      overflow: hidden;
    }
    
    .ar-btn:active { transform: scale(0.95); }

    /* Az Apple "láthatatlan kép" trükkje az összeomlás ellen */
    .apple-ar-img {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0; /* Átlátszó! */
      z-index: 1;
    }

    .btn-text {
      position: relative;
      z-index: 2;
    }
  </style>
</head>
<body>

  <div id="ar-view-container">
    
    <!-- 
      Közvetlenül a HTML-be írjuk a linket (href) 
      és a rel="ar" paramétert, ami aktiválja az Apple AR-t 
    -->
    <a href="https://developer.apple.com/quick-look-gallery/models/cosmonaut/CosmonautSuit_en.reality" rel="ar" class="ar-btn">
      <img src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" class="apple-ar-img" alt="AR Indító" />
      <span class="btn-text">Kipróbálás (AR)</span>
    </a>

  </div>

</body>
</html>
