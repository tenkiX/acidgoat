<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Könyv Teszt - Tökéletesített</title>

  <style>
    body { margin: 0; padding: 0; }
    
    #ar-viewer {
      width: 100%;
      background-color: #f4f4f9;
      position: relative;
    }

    /* A nagy AR gomb stílusa */
    .big-ar-btn {
      padding: 24px 48px;
      font-size: 26px;
      font-weight: bold;
      background-color: #008CBA;
      color: white;
      border: none;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      cursor: pointer;
      text-transform: uppercase;
    }

    /* =========================================
       MOBIL NÉZET: Nincs 3D modell, csak a gomb
       ========================================= */
    @media (max-width: 767px) {
      #ar-viewer {
        height: 100vh; /* Teljes képernyőt kitölti */
      }
      
      /* EZ A TRÜKK: Magát a 3D modellt elrejtjük a háttérből! */
      #ar-viewer::part(default-canvas) {
        visibility: hidden;
      }

      /* A gombot a képernyő mértani közepére tesszük */
      .big-ar-btn {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
      
      .big-ar-btn:active {
        transform: translate(-50%, -50%) scale(0.95);
      }
    }

    /* =========================================
       ASZTALI NÉZET: Van 3D modell, nincs gomb
       ========================================= */
    @media (min-width: 768px) {
      #ar-viewer {
        height: 600px;
      }
      
      /* Asztalin újra látható a 3D modell */
      #ar-viewer::part(default-canvas) {
        visibility: visible;
      }

      /* Asztalin teljesen elrejtjük az AR gombot */
      .big-ar-btn {
        display: none !important;
      }
      
      /* Biztonsági kikapcsolás a gyári ikonra */
      model-viewer::part(default-ar-button) { 
        display: none; 
      }
    }
  </style>
</head>
<body>

  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>

  <!-- 
    ar-modes="scene-viewer quick-look" 
    Kivettük a "webxr"-t, így a stabil Google app nyílik meg, 
    nincs többé 1 méteres repülés!
  -->
  <model-viewer 
    id="ar-viewer"
    src="https://modelviewer.dev/shared-assets/models/RobotExpressive.glb" 
    ios-src="https://modelviewer.dev/shared-assets/models/Astronaut.usdz"
    ar 
    ar-modes="scene-viewer quick-look" 
    camera-controls 
    autoplay 
    animation-name="Dance"
    shadow-intensity="1">
    
    <!-- Ez a natív gomb első kattintásra működik -->
    <button slot="ar-button" class="big-ar-btn">
      Kipróbálás (AR)
    </button>

  </model-viewer>

</body>
</html>
