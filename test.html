<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Könyv - Natív App Indító</title>

  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; background-color: #f4f4f9; }

    /* =========================================
       MOBIL NÉZET: Teljesen letisztult gomb
       ========================================= */
    #mobile-ar-view {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    /* A gomb valójában egy szimpla link, amit gombnak álcázunk */
    .ar-btn {
      display: inline-block;
      padding: 24px 48px;
      font-size: 26px;
      font-weight: bold;
      background-color: #008CBA;
      color: white;
      text-decoration: none;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      text-transform: uppercase;
      text-align: center;
    }
    
    .ar-btn:active { transform: scale(0.95); }

    /* =========================================
       ASZTALI NÉZET: Itt jelenik csak meg a 3D
       ========================================= */
    #desktop-3d-view {
      display: none; /* Mobilon ezt fizikailag eltávolítjuk a képről */
      width: 100%;
      height: 600px;
    }

    @media (min-width: 768px) {
      #mobile-ar-view { display: none; } /* Asztalin eltűnik a gomb */
      #desktop-3d-view { display: block; } /* Asztalin megjelenik a forgatható modell */
    }
  </style>
</head>
<body>

  <!-- MOBILON KIZÁRÓLAG EZ LÉTEZIK (Nincs 3D canvas a háttérben!) -->
  <div id="mobile-ar-view">
    <a id="ar-link" href="#" class="ar-btn">Kipróbálás (AR)</a>
  </div>

  <!-- ASZTALIN KIZÁRÓLAG EZ LÉTEZIK -->
  <div id="desktop-3d-view">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <model-viewer 
      src="https://modelviewer.dev/shared-assets/models/RobotExpressive.glb" 
      camera-controls autoplay animation-name="Dance" shadow-intensity="1"
      style="width: 100%; height: 100%;">
    </model-viewer>
  </div>

  <!-- JAVASCRIPT: Közvetlenül az OpRendszert hívja meg mobilon -->
  <script>
    const userAgent = navigator.userAgent || navigator.vendor || window.opera;
    const arLink = document.getElementById('ar-link');

    const glbUrl = "https://modelviewer.dev/shared-assets/models/RobotExpressive.glb";
    const usdzUrl = "https://modelviewer.dev/shared-assets/models/Astronaut.usdz";

    // 1. Ha a telefon iOS (iPhone / iPad)
    if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
      arLink.href = usdzUrl;
      arLink.setAttribute("rel", "ar");
      // Az Apple megköveteli egy üres kép jelenlétét a gombon belül az AR indításához
      arLink.innerHTML = "<img src='data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=' style='display:none;' />Kipróbálás (AR)";
    } 
    // 2. Ha a telefon Android
    else {
      // A mode=ar_only garantálja, hogy NE a böngészős forgatást nyissa meg. Csak a kamera!
      const intentUrl = `intent://arvr.google.com/scene-viewer/1.0?file=${glbUrl}&mode=ar_only#Intent;scheme=https;package=com.google.ar.core;action=android.intent.action.VIEW;end;`;
      arLink.href = intentUrl;
    }
  </script>

</body>
</html>
